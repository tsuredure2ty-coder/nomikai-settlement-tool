<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>飲み会の清算</title>
  <link rel="stylesheet" href="app-style.css?v=20261027">
  <script defer src="public-config.js?v=20261027"></script>
  <script defer src="app-core.js?v=20261027"></script>
  <script defer src="app-storage.js?v=20261027"></script>
  <script defer src="cloud-sync.js?v=20261027"></script>
  <script defer src="workspace.js?v=20261027"></script>
  <script defer src="app.js?v=20261027"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="index.html"><span class="brand-symbol" aria-hidden="true">清</span><span>飲み会の清算<small>いつもの集まりを、気持ちよく。</small></span></a>
      <button id="accountButton" class="quiet-button" type="button">端末で利用中</button>
    </header>
    <nav id="navigation" class="main-nav" aria-label="メインメニュー">
      <button type="button" data-page="current" aria-current="page">今回の清算</button>
      <button type="button" data-page="templates">テンプレート</button>
      <button type="button" data-page="history">履歴</button>
      <button type="button" data-page="settings">同期・設定</button>
    </nav>
    <div class="status-line"><span id="saveStatus" role="status">読み込み中…</span><button id="syncButton" class="text-button" type="button" hidden>今すぐ同期</button></div>
    <div id="protection" class="notice" role="alert" hidden></div>
    <main id="view" tabindex="-1"><p>入力内容を読み込んでいます。</p></main>
    <footer class="app-footer"><span>あなたのための、小さな幹事ツール。</span><a href="legacy.html">旧画面を開く</a></footer>
  </div>
  <dialog id="editor" aria-labelledby="editorTitle"><form id="editorForm"><div id="editorContent"></div></form></dialog>
  <dialog id="confirmation" aria-labelledby="confirmationTitle"><h2 id="confirmationTitle">内容の確認</h2><p id="confirmationMessage"></p><div class="dialog-actions"><button id="confirmationCancel" class="secondary-button" type="button">キャンセル</button><button id="confirmationAccept" class="primary-button" type="button">続ける</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>このツールを使うには、JavaScriptを有効にしてください。</noscript>
</body>
</html>
